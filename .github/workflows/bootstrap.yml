name: Bootstrap MAGNISA runtime source

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/runtime_chunk_*'
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild and unpack MAGNISA source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/runtime_chunk_* | base64 -d > /tmp/magnisa_runtime.tar.xz
          mkdir -p /tmp/magnisa-runtime
          tar -xJf /tmp/magnisa_runtime.tar.xz -C /tmp/magnisa-runtime
          rsync -a --delete             --exclude '.git/'             --exclude '.github/workflows/bootstrap.yml'             /tmp/magnisa-runtime/ ./
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml
      - name: Commit full source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MAGNISA deployment bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Deploy full MAGNISA runtime source"
          git push origin HEAD:main
