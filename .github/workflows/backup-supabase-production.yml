name: Encrypted Supabase Production Backup Verification

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/backup-supabase-production.yml
      - supabase/migrations/**
      - scripts/ci/apply-production-allowlist.sh

permissions:
  contents: read

concurrency:
  group: magnisa-supabase-production-backup
  cancel-in-progress: false

jobs:
  backup-and-restore-test:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_URL: https://pmlzirobpdlzsrvtkvir.supabase.co
      SUPABASE_PROJECT_REF: pmlzirobpdlzsrvtkvir
      SUPABASE_DB_HOST: aws-1-us-west-2.pooler.supabase.com
      SUPABASE_DB_USER: postgres.pmlzirobpdlzsrvtkvir
      PGSSLMODE: require
    steps:
      - uses: actions/checkout@v4

      - name: Verify database credential is configured without printing it
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_PASSWORD" || { echo "::error::Add SUPABASE_DB_PASSWORD to the GitHub production environment secrets"; exit 1; }
          test -n "$BACKUP_ENCRYPTION_PASSPHRASE" || { echo "::error::Add a separate BACKUP_ENCRYPTION_PASSPHRASE secret to the GitHub production environment"; exit 1; }
          test "${#BACKUP_ENCRYPTION_PASSPHRASE}" -ge 32 || { echo "::error::BACKUP_ENCRYPTION_PASSPHRASE must contain at least 32 characters"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "::error::Add SUPABASE_SERVICE_ROLE_KEY to the GitHub production environment secrets for Storage export"; exit 1; }
          echo "::add-mask::$SUPABASE_SERVICE_ROLE_KEY"
          command -v gpg >/dev/null || { echo "::error::GnuPG is unavailable on the runner"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install production Node dependencies for Storage export/restore
        run: npm ci --omit=dev --ignore-scripts
      - name: Check Storage backup scripts
        run: |
          node --check scripts/backup/export-supabase-storage.mjs
          node --check scripts/backup/restore-supabase-storage.mjs
          node --check scripts/backup/verify-supabase-storage.mjs

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 3.0.0

      - name: Install PostgreSQL client for isolated migration replay
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Build an encoded connection string in the runner environment
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from urllib.parse import quote
          password = quote(os.environ["SUPABASE_DB_PASSWORD"], safe="")
          user = os.environ["SUPABASE_DB_USER"]
          host = os.environ["SUPABASE_DB_HOST"]
          url = f"postgresql://{user}:{password}@{host}:5432/postgres"
          print("::add-mask::" + url)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write("SUPABASE_DB_URL=" + url + chr(10))
          PY

      - name: Inspect database version, Auth, Storage and business data without modifying Production
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backup
          docker run --rm --network host \
            -e PGPASSWORD="$SUPABASE_DB_PASSWORD" -e PGSSLMODE=require \
            postgres:17 psql \
              -h "$SUPABASE_DB_HOST" -p 5432 -U "$SUPABASE_DB_USER" -d postgres \
              -v ON_ERROR_STOP=1 -At -F '|' \
              -c "select current_setting('server_version'), (select count(*) from auth.users), (select count(*) from storage.buckets), (select count(*) from storage.objects), (select count(*) from public.prospects), (select count(*) from public.financial_accounts), (select count(*) from public.prospect_interventions);" \
            > backup/production-summary.tsv
          STORAGE_OBJECTS=$(cut -d '|' -f 4 backup/production-summary.tsv)
          node scripts/backup/export-supabase-storage.mjs
          MANIFEST_OBJECTS=$(node -e 'process.stdout.write(String(JSON.parse(require("fs").readFileSync("backup/storage-manifest.json","utf8")).objectCount))')
          test "$STORAGE_OBJECTS" = "$MANIFEST_OBJECTS" || { echo "::error::Storage API object count does not match PostgreSQL metadata"; exit 1; }
          docker run --rm --network host \
            -e PGPASSWORD="$SUPABASE_DB_PASSWORD" -e PGSSLMODE=require \
            postgres:17 psql \
              -h "$SUPABASE_DB_HOST" -p 5432 -U "$SUPABASE_DB_USER" -d postgres \
              -v ON_ERROR_STOP=1 -At \
              -c "select format('select %L, count(*) from %I.%I;', table_schema || '.' || table_name, table_schema, table_name) from information_schema.tables where table_type='BASE TABLE' and table_schema in ('auth','extensions','graphql','graphql_public','private','public','storage','supabase_migrations') order by table_schema, table_name;" \
            > backup/counts.sql
          docker run --rm --network host -v "$PWD/backup:/backup" \
            -e PGPASSWORD="$SUPABASE_DB_PASSWORD" -e PGSSLMODE=require \
            postgres:17 psql \
              -h "$SUPABASE_DB_HOST" -p 5432 -U "$SUPABASE_DB_USER" -d postgres \
              -v ON_ERROR_STOP=1 -At -f /backup/counts.sql \
            > backup/production-counts.tsv
          echo "Production schema inventory, exact row counts, and Storage binary object inventory recorded and cross-checked against the Storage API."

      - name: Export custom database roles using the official Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          supabase db dump --db-url "$SUPABASE_DB_URL" --role-only --file backup/roles.sql

      - name: Export all deployed database schemas including Auth, Storage, Vault and migration history
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -e PGPASSWORD="$SUPABASE_DB_PASSWORD" -e PGSSLMODE=require \
            -v "$PWD/backup:/backup" \
            postgres:17 pg_dump \
              -h "$SUPABASE_DB_HOST" -p 5432 -U "$SUPABASE_DB_USER" -d postgres \
              --format=custom --no-owner \
              --schema=auth --schema=cron --schema=extensions --schema=graphql \
              --schema=graphql_public --schema=private --schema=public --schema=realtime \
              --schema=storage --schema=supabase_migrations --schema=vault \
              --file=/backup/magnisa-production.dump

      - name: Restore the backup into a disposable database and verify Storage
        shell: bash
        run: |
          set -euo pipefail
          supabase start -x studio,edge-runtime,logflare,vector,analytics
          LOCAL_ENV=$(supabase status -o env)
          LOCAL_DB_URL=$(printf '%s\n' "$LOCAL_ENV" | sed -n 's/^DB_URL=//p' | tr -d '"')
          LOCAL_API_URL=$(printf '%s\n' "$LOCAL_ENV" | sed -n 's/^API_URL=//p' | tr -d '"')
          LOCAL_SERVICE_ROLE_KEY=$(printf '%s\n' "$LOCAL_ENV" | sed -n 's/^SERVICE_ROLE_KEY=//p' | tr -d '"')
          LOCAL_DB_CONTAINER=$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)
          test -n "$LOCAL_DB_URL" && test -n "$LOCAL_API_URL" && test -n "$LOCAL_SERVICE_ROLE_KEY" && test -n "$LOCAL_DB_CONTAINER"
          docker exec "$LOCAL_DB_CONTAINER" pg_isready -U postgres -d postgres
          echo "::add-mask::$LOCAL_SERVICE_ROLE_KEY"

          # Keep the local Supabase system database untouched. Restore the
          # production dump into a fresh database on the same PostgreSQL 17
          # server. Keep Realtime, Vault and Cron in the encrypted dump, but
          # exclude them from local replay: Realtime functions need a privileged
          # log_min_messages setting, Vault contains production secrets, and the
          # local stack does not provision the pg_cron schema. These are managed
          # platform schemas, not application business data.
          # The encrypted dump retains ownership and ACLs; local replay omits
          # them because its postgres role cannot change other roles' defaults.
          # Storage binary objects are restored separately through the local
          # Storage API and verified by SHA-256.
          POSTGRES_CREATEDB=$(docker run --rm --network host postgres:17 \
            psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 -At \
              -c "select rolcreatedb from pg_roles where rolname='postgres'")
          test "$POSTGRES_CREATEDB" = "t" || {
            echo "::error::The isolated local postgres role cannot create the disposable restore database."
            exit 1
          }
          docker run --rm --network host postgres:17 \
            psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 \
              -c "CREATE DATABASE magnisa_restore"
          RESTORE_DB_URL=$(printf '%s\n' "$LOCAL_DB_URL" | sed 's#/postgres$#/magnisa_restore#')
          test -n "$RESTORE_DB_URL"

          # A newly created PostgreSQL database contains an empty public schema.
          # The production dump also creates public, so remove only that empty
          # template schema before restoring without pg_restore --clean.
          docker run --rm --network host postgres:17 \
            psql "$RESTORE_DB_URL" -v ON_ERROR_STOP=1 \
              -c "DROP SCHEMA IF EXISTS public CASCADE"

          docker run --rm --network host -v "$PWD/backup:/backup" postgres:17 \
            psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 -f /backup/roles.sql
          POSTGRES_CREATEDB_AFTER=$(docker run --rm --network host postgres:17 \
            psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 -At \
              -c "select rolcreatedb from pg_roles where rolname='postgres'")
          test "$POSTGRES_CREATEDB_AFTER" = "t" || {
            echo "::error::The role backup changed local postgres CREATEDB privileges; refusing to continue."
            exit 1
          }

          docker run --rm --network host -v "$PWD/backup:/backup" postgres:17 \
            pg_restore --dbname="$RESTORE_DB_URL" --no-owner --no-acl --exclude-schema=realtime --exclude-schema=vault --exclude-schema=cron --exit-on-error \
              --section=pre-data /backup/magnisa-production.dump
          docker run --rm --network host -v "$PWD/backup:/backup" postgres:17 \
            pg_restore --dbname="$RESTORE_DB_URL" --no-owner --no-acl --exclude-schema=realtime --exclude-schema=vault --exclude-schema=cron --exit-on-error \
              --section=data /backup/magnisa-production.dump
          docker run --rm --network host -v "$PWD/backup:/backup" postgres:17 \
            pg_restore --dbname="$RESTORE_DB_URL" --no-owner --no-acl --exclude-schema=realtime --exclude-schema=vault --exclude-schema=cron --exit-on-error \
              --section=post-data /backup/magnisa-production.dump

          SUPABASE_URL="$LOCAL_API_URL" SUPABASE_SERVICE_ROLE_KEY="$LOCAL_SERVICE_ROLE_KEY" \
            node scripts/backup/restore-supabase-storage.mjs
          SUPABASE_URL="$LOCAL_API_URL" SUPABASE_SERVICE_ROLE_KEY="$LOCAL_SERVICE_ROLE_KEY" \
            node scripts/backup/verify-supabase-storage.mjs
          docker run --rm --network host -v "$PWD/backup:/backup" postgres:17 \
            psql "$RESTORE_DB_URL" -v ON_ERROR_STOP=1 -At -f /backup/counts.sql \
            > backup/restored-counts.tsv
          diff -u backup/production-counts.tsv backup/restored-counts.tsv
          echo "Restore test passed: exact PostgreSQL row counts for application and restorable Supabase schemas, plus Storage binary SHA-256 hashes, match. The encrypted dump retains the platform-managed Realtime, Vault and Cron schemas."

          # Exercise the exact reviewed production migration set against the
          # freshly restored production snapshot. Production remains untouched.
          SUPABASE_DB_URL="$RESTORE_DB_URL" bash scripts/ci/apply-production-allowlist.sh apply
          docker run --rm --network host postgres:17 \
            psql "$RESTORE_DB_URL" -v ON_ERROR_STOP=1 -At <<'SQL'
          DO $$
          BEGIN
            IF to_regclass('public.pcg2005_balance_sheet_rules') IS NULL
              OR to_regclass('public.pcg2005_balance_sheet_passif_rules') IS NULL
              OR to_regclass('public.inventory_counts') IS NULL
              OR to_regclass('public.inventory_count_lines') IS NULL
              OR to_regclass('public.pcg2005_supplier_invoice_mappings') IS NULL
              OR to_regclass('public.pcg2005_expense_mappings') IS NULL THEN
              RAISE EXCEPTION 'Required balance-sheet, inventory or source-mapping schema is missing after migration replay';
            END IF;

            IF NOT EXISTS (
              SELECT 1 FROM pg_proc p
              JOIN pg_namespace n ON n.oid=p.pronamespace
              WHERE n.nspname='public' AND p.proname='get_accounting_receivable_maturity'
            ) THEN
              RAISE EXCEPTION 'Receivable maturity RPC is missing after migration replay';
            END IF;

            IF (
              SELECT count(*) FROM public.pcg2005_journal_lines
              WHERE reference IN ('FOUR-1','FOUR-9898')
                AND pcg_code IS NULL
                AND mapping_status='a_mapper'
            ) <> 2 THEN
              RAISE EXCEPTION 'Undocumented generic supplier invoices FOUR-1 and FOUR-9898 must remain unmapped, not classified as fixed assets';
            END IF;
            IF EXISTS (
              SELECT 1 FROM public.journal_entries
              WHERE status='posted' AND abs(total_debit-total_credit)>=0.01
            ) THEN
              RAISE EXCEPTION 'Unbalanced posted journal entry detected after migration replay';
            END IF;

            IF EXISTS (
              SELECT organization_id
              FROM public.pcg2005_journal_lines
              WHERE status='posted'
                AND source_type IN ('internal_transfer_debit','internal_transfer_credit')
                AND account_key LIKE 'TRANSIT:%'
                AND pcg_code='581'
              GROUP BY organization_id
              HAVING abs(sum(debit-credit))>=0.01
            ) THEN
              RAISE EXCEPTION 'Internal-transfer clearing entries do not net to zero on PCG 581';
            END IF;

            IF EXISTS (
              SELECT sp.id
              FROM public.supplier_payments sp
              LEFT JOIN public.journal_entries je
                ON je.source_id=sp.id AND je.source_type='supplier_payment'
              GROUP BY sp.id,sp.amount
              HAVING count(je.id)<>1
                OR abs(COALESCE(max(je.total_debit),0)-sp.amount)>=0.01
                OR abs(COALESCE(max(je.total_credit),0)-sp.amount)>=0.01
            ) THEN
              RAISE EXCEPTION 'Supplier payment does not have exactly one balanced journal entry';
            END IF;

            IF EXISTS (
              SELECT si.id
              FROM public.supplier_invoices si
              LEFT JOIN public.supplier_payments sp ON sp.supplier_invoice_id=si.id
              GROUP BY si.id,si.paid_amount
              HAVING abs(si.paid_amount-COALESCE(sum(sp.amount),0))>=0.01
            ) THEN
              RAISE EXCEPTION 'Supplier invoice paid amount does not reconcile to its payment rows';
            END IF;

            IF EXISTS (
              SELECT fa.id
              FROM public.financial_accounts fa
              LEFT JOIN public.financial_transactions ft
                ON ft.organization_id=fa.organization_id
               AND ft.financial_account_id=fa.id
              GROUP BY fa.id,fa.balance
              HAVING abs(fa.balance-COALESCE(sum(ft.amount),0))>=0.01
            ) THEN
              RAISE EXCEPTION 'Treasury subledger balance does not reconcile to its movements';
            END IF;

            IF EXISTS (
              WITH financial_by_code AS (
                SELECT organization_id,pcg_account_code,sum(balance) financial_balance
                FROM public.financial_accounts
                WHERE pcg_account_code IS NOT NULL
                GROUP BY organization_id,pcg_account_code
              ),
              ledger_by_code AS (
                SELECT organization_id,pcg_code,sum(debit-credit) ledger_balance
                FROM public.pcg2005_journal_lines
                WHERE status='posted'
                  AND pcg_code ~ '^(511|512|515|517|518|53|54)$'
                GROUP BY organization_id,pcg_code
              ),
              comparison AS (
                SELECT COALESCE(f.organization_id,l.organization_id) organization_id,
                  COALESCE(f.pcg_account_code,l.pcg_code) pcg_code,
                  COALESCE(f.financial_balance,0)-COALESCE(l.ledger_balance,0) difference
                FROM financial_by_code f
                FULL OUTER JOIN ledger_by_code l
                  ON l.organization_id=f.organization_id AND l.pcg_code=f.pcg_account_code
              )
              SELECT 1 FROM comparison WHERE abs(difference)>=0.01
            ) THEN
              RAISE EXCEPTION 'PCG class 5 balances do not reconcile to treasury accounts';
            END IF;

            IF (
              SELECT count(*) FROM public.pcg2005_journal_lines
              WHERE reference IN ('FOUR-2030','FOUR-2031')
                AND organization_id IN (
                  SELECT DISTINCT organization_id FROM public.supplier_invoices
                  WHERE supplier_number IN ('2030','2031')
                )
                AND pcg_code='606'
                AND mapping_status='manuel'
                AND mapping_evidence_status='record_only'
                AND mapping_requires_attachment
            ) <> 2 THEN
              RAISE EXCEPTION 'Computer Store invoices 2030 and 2031 must map to PCG 606 with missing-invoice evidence flags';
            END IF;

            IF (
              SELECT count(*) FROM public.pcg2005_journal_lines
              WHERE reference IN ('DEP-00003','DEP-00004')
                AND organization_id IN (
                  SELECT DISTINCT organization_id FROM public.expenses
                  WHERE magnisa_reference IN ('DEP-00003','DEP-00004')
                )
                AND pcg_code='218'
                AND mapping_status='manuel'
                AND mapping_evidence_status='record_only'
                AND mapping_requires_attachment
                AND mapping_requires_asset_register
                AND mapping_requires_useful_life
            ) <> 2 THEN
              RAISE EXCEPTION 'Computer acquisitions DEP-00003 and DEP-00004 must map provisionally to PCG 218';
            END IF;

            IF (
              SELECT COALESCE(abs(sum(debit_difference)),0)
              FROM public.fixed_asset_register_reconciliation
              WHERE account_code='218'
                AND organization_id IN (
                  SELECT DISTINCT organization_id FROM public.expenses
                  WHERE magnisa_reference IN ('DEP-00003','DEP-00004')
                )
            ) <> 9000000 THEN
              RAISE EXCEPTION 'The 9,000,000 MGA computer asset register gap must remain visible';
            END IF;

            IF (
              SELECT count(*) FROM supabase_migrations.schema_migrations
              WHERE version IN (
                '20261107170000','20261109170000','20261109290000','20261109300000',
                '20261110000000','20261110090000','20261110091500','20261110093000',
                '20261110094000','20261110095000','20261110100000'
              )
            ) <> 11 THEN
              RAISE EXCEPTION 'The exact eleven allowlisted migration versions were not recorded';
            END IF;
          END $$;
          SQL

          docker run --rm --network host postgres:17 \
            psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 \
              -c "DROP DATABASE IF EXISTS magnisa_restore WITH (FORCE)"
          echo "Disposable restore database removed after successful verification."

      - name: Package, encrypt, and verify the backup archive
        shell: bash
        run: |
          set -euo pipefail
          tar -czf backup/magnisa-production.tar.gz -C backup production-summary.tsv production-counts.tsv restored-counts.tsv roles.sql magnisa-production.dump storage-manifest.json storage -C "$GITHUB_WORKSPACE" supabase/functions
          PASSPHRASE_FILE=$(mktemp)
          chmod 600 "$PASSPHRASE_FILE"
          trap 'rm -f "$PASSPHRASE_FILE"' EXIT
          printf '%s' "$BACKUP_ENCRYPTION_PASSPHRASE" > "$PASSPHRASE_FILE"
          gpg --batch --yes --pinentry-mode loopback \
            --symmetric --cipher-algo AES256 --compress-algo none \
            --s2k-mode 3 --s2k-digest-algo SHA512 --s2k-count 65011712 \
            --passphrase-file "$PASSPHRASE_FILE" \
            --output backup/magnisa-production.tar.gz.gpg \
            backup/magnisa-production.tar.gz
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase-file "$PASSPHRASE_FILE" \
            --output backup/verified-decryption.tar.gz \
            --decrypt backup/magnisa-production.tar.gz.gpg
          cmp backup/magnisa-production.tar.gz backup/verified-decryption.tar.gz
          sha256sum backup/magnisa-production.tar.gz.gpg | awk '{print $1}' > backup/magnisa-production.tar.gz.gpg.sha256
          rm -f backup/magnisa-production.tar.gz backup/verified-decryption.tar.gz backup/magnisa-production.dump backup/roles.sql
          rm -rf backup/storage backup/storage-manifest.json
          echo "Encrypted archive decrypted and byte-for-byte verified; only encrypted archive and checksum will be uploaded."

      - name: Upload encrypted backup only
        uses: actions/upload-artifact@v4
        with:
          name: magnisa-supabase-production-encrypted-backup
          path: |
            backup/magnisa-production.tar.gz.gpg
            backup/magnisa-production.tar.gz.gpg.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Stop isolated Supabase stack
        if: always()
        run: supabase stop --no-backup || true
