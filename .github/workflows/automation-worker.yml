name: MAGNISA automation worker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: magnisa-automation-worker
  cancel-in-progress: false

jobs:
  run-worker:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Request short-lived GitHub OIDC token and invoke worker
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('magnisa-automation-worker');
            const response = await fetch('https://magnisa.vercel.app/api/cron/automation-worker', {
              method: 'GET',
              headers: { Authorization: `Bearer ${token}` },
              signal: AbortSignal.timeout(70000),
            });
            const body = await response.text();
            core.info(body.slice(0, 12000));
            if (!response.ok) {
              core.setFailed(`Automation worker returned HTTP ${response.status}`);
            }
