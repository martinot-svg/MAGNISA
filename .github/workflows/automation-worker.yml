name: MAGNISA automation worker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: magnisa-automation-worker
  cancel-in-progress: false

jobs:
  run-worker:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Require worker credentials
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET}" ]; then
            echo "::error::Repository Actions secret CRON_SECRET is not configured; refusing unauthenticated worker invocation."
            exit 1
          fi

      - name: Invoke production automation worker
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --max-time 70 \
            --output "$response_file" --write-out "%{http_code}" \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "https://magnisa.vercel.app/api/cron/automation-worker")"
          cat "$response_file"
          rm -f "$response_file"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Automation worker returned HTTP $status"
            exit 1
          fi
