name: Supabase migration replay
on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-migration-replay.yml"
      - "scripts/ci/**"
  push:
    branches:
      - main
      - 'fix/**'
    paths:
      - "supabase/**"
permissions:
  contents: read
concurrency:
  group: supabase-replay-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        id: supabase_cli
        with:
          version: 3.0.0
      - name: Start local Supabase stack on PostgreSQL 17
        run: supabase start -x studio,edge-runtime,logflare,vector,analytics
      - name: Replay every migration from a clean database
        run: supabase db reset --yes
      - name: Verify public RPC execution grants
        run: |
          DB_URL=$(supabase status -o env | sed -n 's/^DB_URL=//p' | tr -d '"')
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/default-rpc-execution.sql
      - name: Verify procurement and stock ledger security invariants
        run: |
          DB_URL=$(supabase status -o env | sed -n 's/^DB_URL=//p' | tr -d '"')
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/procurement-ledger-invariants.sql
      - name: Verify anonymous table and sequence privileges
        run: |
          DB_URL=$(supabase status -o env | sed -n 's/^DB_URL=//p' | tr -d '"')
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/anon-privileges.sql
      - name: Verify private legal archive access
        run: |
          DB_URL=$(supabase status -o env | sed -n 's/^DB_URL=//p' | tr -d '"')
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/private-payroll-archive.sql
      - name: Verify payroll activation rejects identical start dates
        run: |
          DB_URL=$(supabase status -o env | sed -n 's/^DB_URL=//p' | tr -d '"')
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/payroll-rule-activation-date-conflicts.sql
      - name: Verify payroll accounting posting and supplementary pension
        run: |
          DB_URL=$(supabase status -o env | sed -n 's/^DB_URL=//p' | tr -d '"')
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/payroll-accounting-posting.sql
      - name: Verify payroll rule archival behavior
        run: |
          DB_URL=$(supabase status -o env | sed -n 's/^DB_URL=//p' | tr -d '"')
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/payroll-rule-archival.sql
      - name: Verify fiscal-year opening, carry-forward and close guards
        run: |
          DB_URL=$(supabase status -o env | sed -n 's/^DB_URL=//p' | tr -d '"')
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/accounting-fiscal-year-opening-closing.sql
      - name: Verify fixed-asset PCG, posting, component and RLS invariants
        run: |
          DB_URL=$(supabase status -o env | sed -n 's/^DB_URL=//p' | tr -d '"')
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/fixed-assets-accounting.sql
      - name: Verify automatic PCG 581 mapping for internal transfer clearing
        run: |
          DB_URL=$(supabase status -o env | sed -n 's/^DB_URL=//p' | tr -d '"')
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/pcg-internal-transfer-581.sql
      - name: Verify safe legacy PCG mapping and transit classification
        run: |
          DB_URL=$(supabase status -o env | sed -n 's/^DB_URL=//p' | tr -d '"')
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/pcg-mapping-view-integrity.sql
      - name: Verify collaborative prospect contribution security and automation
        run: |
          DB_URL=$(supabase status -o env | sed -n 's/^DB_URL=//p' | tr -d '"')
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/prospect-collaboration.sql
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install app and browser test dependencies
        run: |
          npm ci --no-audit --no-fund
          npx --yes npm@11.19.1 install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Syntax-check encrypted backup and Storage restore scripts
        run: |
          node --check scripts/backup/export-supabase-storage.mjs
          node --check scripts/backup/restore-supabase-storage.mjs
          node --check scripts/backup/verify-supabase-storage.mjs
      - name: Export isolated local Supabase credentials
        run: |
          eval "$(supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY|DB_URL)=')"
          echo "DB_URL=$DB_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_APP_URL=http://127.0.0.1:3000" >> "$GITHUB_ENV"
          echo "TEST_EMAIL=payroll-ui-smoke@magnisa.test" >> "$GITHUB_ENV"
          TEST_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$TEST_PASSWORD"
          echo "TEST_PASSWORD=$TEST_PASSWORD" >> "$GITHUB_ENV"
      - name: Create authenticated local test user
        id: ui_user
        run: node scripts/ci/create-payroll-ui-user.mjs
      - name: Seed isolated payroll test organization
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 -v user_id="${{ steps.ui_user.outputs.user_id }}" -f supabase/tests/payroll-ui-seed.sql
      - name: Exercise fixed-asset accounting workflows with authenticated user
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 -v user_id="${{ steps.ui_user.outputs.user_id }}" -f supabase/tests/fixed-assets-integration.sql
      - name: Test fixed-asset register and reconciliation RLS
        run: node scripts/ci/fixed-assets-rls-integration.mjs
      - name: Test collaborative CRM RPCs, commission splits and tenant isolation
        run: node scripts/ci/crm-collaboration-integration.mjs
      - name: Verify snapshot-aware payslip RPC privileges
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/payroll-snapshot-security.sql
      - name: Test payroll payment lifecycle and idempotency
        run: node scripts/ci/payroll-payment-integration.mjs
      - name: Start MAGNISA locally
        id: app_server
        run: |
          npm run dev -- --hostname 127.0.0.1 > /tmp/magnisa-next.log 2>&1 &
          echo $! > /tmp/magnisa-next.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/login >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/magnisa-next.log
          exit 1
      - name: Test authenticated payroll and fixed-asset UI actions
        run: node scripts/ci/payroll-ui-smoke.mjs
      - name: Test authenticated CRM UI actions
        if: always() && steps.ui_user.outcome == 'success' && steps.app_server.outcome == 'success'
        run: node scripts/ci/crm-ui-smoke.mjs
      - name: Stop MAGNISA local server
        if: always()
        run: |
          if [ -f /tmp/magnisa-next.pid ]; then kill "$(cat /tmp/magnisa-next.pid)" || true; fi
      - name: Show local app logs after UI smoke failure
        if: failure()
        run: cat /tmp/magnisa-next.log || true
      - name: Stop local Supabase
        if: always() && steps.supabase_cli.outcome == 'success'
        run: supabase stop --no-backup