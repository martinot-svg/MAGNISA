name: Configure Supabase email OTP

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/set-supabase-auth-otp.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: pmlzirobpdlzsrvtkvir
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Ensure Supabase access token exists
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "SUPABASE_ACCESS_TOKEN secret is not configured."
            exit 2
          fi

      - name: Set email OTP to 6 digits and 5 minute expiry
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS -o /dev/null -w '%{http_code}' \
            -X PATCH "https://api.supabase.com/v1/projects/${PROJECT_REF}/config/auth" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"mailer_otp_length":6,"mailer_otp_exp":300}')"
          if [ "$status" != "200" ]; then
            echo "Supabase Auth config update failed with HTTP $status."
            exit 1
          fi

      - name: Verify effective OTP config
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -sS \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/config/auth" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}")"
          length="$(printf '%s' "$response" | jq -r '.mailer_otp_length')"
          expiry="$(printf '%s' "$response" | jq -r '.mailer_otp_exp')"
          echo "mailer_otp_length=$length"
          echo "mailer_otp_exp=$expiry"
          test "$length" = "6"
          test "$expiry" = "300"
