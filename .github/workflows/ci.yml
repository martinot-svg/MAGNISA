name: MAGNISA CI

on:
  push:
    branches: [main, 'fix/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: magnisa-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  magnibox-local-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start isolated Supabase and apply migrations
        shell: bash
        run: |
          set -euo pipefail
          # MAGNIBOX integration tests do not use Supabase Inbucket; skip it to avoid
          # binding the runner's commonly occupied host port 54324.
          supabase start -x inbucket
          supabase db reset
          eval "$(supabase status -o env)"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"

      - name: Run MAGNIBOX worker + Storage + ClamAV end-to-end test
        run: npm run test:magnibox:integration

      - name: Stop isolated Supabase
        if: always()
        run: supabase stop

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_APP_URL: https://magnisa.vercel.app
      NEXT_PUBLIC_SUPABASE_URL: https://pmlzirobpdlzsrvtkvir.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_pL2Aw_tHI8kletdh9PquVg__JDKmDw9
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify complete cross-platform Next.js SWC lockfile
        run: node scripts/ci/check-next-swc-lockfile.mjs

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate production migration scripts syntax
        run: |
          bash -n scripts/ci/check-production-migration-history.sh
          bash -n scripts/ci/apply-production-allowlist.sh

      - name: Test production migration history reconciliation fixtures
        run: bash tests/ci/check-production-migration-history.test.sh

      - name: Generate exhaustive static interaction registry
        run: node scripts/qa/build-interaction-registry.mjs

      - name: Enforce interactive form and button contracts
        run: node scripts/qa/check-interactive-contracts.mjs

      - name: Validate Magnibox self-hosted MTA scaffold
        run: |
          bash -n scripts/ci/check-magnibox-mta-scaffold.sh
          bash scripts/ci/check-magnibox-mta-scaffold.sh
          bash -n infra/magnibox-mail/scripts/check-host-readiness.sh
          bash -n tests/ci/check-magnibox-host-readiness.test.sh
          bash tests/ci/check-magnibox-host-readiness.test.sh
          sh -n infra/magnibox-mail/scripts/check-antivirus-readiness.sh
          bash -n tests/ci/check-magnibox-antivirus-readiness.test.sh
          bash tests/ci/check-magnibox-antivirus-readiness.test.sh
          bash -n infra/magnibox-mail/scripts/probe-public-endpoints.sh
          bash -n tests/ci/check-magnibox-public-mta-probe.test.sh
          bash tests/ci/check-magnibox-public-mta-probe.test.sh

      - name: Validate isolated Magnibox Mailpit test service
        run: |
          bash -n scripts/ci/check-magnibox-mailpit.sh
          bash scripts/ci/check-magnibox-mailpit.sh
          bash -n scripts/ci/check-magnibox-mailpit-relay.sh
          bash scripts/ci/check-magnibox-mailpit-relay.sh

      - name: Validate isolated Magnibox local development stack
        run: bash scripts/ci/check-magnibox-local-dev.sh

      - name: Exercise real ClamAV INSTREAM scanner
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name magnibox-clamav-integration -p 127.0.0.1:3310:3310 clamav/clamav:1.4.3
          trap 'docker rm -f magnibox-clamav-integration >/dev/null 2>&1 || true' EXIT
          ready=0
          for attempt in $(seq 1 90); do
            if docker exec magnibox-clamav-integration clamdscan --ping=1 >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 5
          done
          if [ "$ready" -ne 1 ]; then
            docker logs magnibox-clamav-integration
            echo "ClamAV did not become ready within 7.5 minutes" >&2
            exit 1
          fi
          npx tsx scripts/ci/test-magnibox-clamav-integration.ts

      - name: Build and verify isolated Magnibox attachment worker image
        run: |
          set -euo pipefail
          docker build --pull --file infra/magnibox-mail/worker/Dockerfile --tag magnibox-attachment-worker:ci .
          test "$(docker image inspect --format '{{.Config.User}}' magnibox-attachment-worker:ci)" = "node"
          docker image inspect --format 'Entrypoint={{json .Config.Entrypoint}} Cmd={{json .Config.Cmd}}' magnibox-attachment-worker:ci


      - name: Validate Magnibox Postfix inbound bridge
        run: bash scripts/ci/check-magnibox-inbound-bridge.sh

      - name: Validate Magnibox recipient provisioning sync
        run: bash scripts/ci/check-magnibox-provision-sync.sh

      - name: Validate Magnibox delivery event forwarding
        run: bash scripts/ci/check-magnibox-delivery-events.sh

      - name: Dependency audit report
        run: |
          npm audit --json > npm-audit.json || true
          node -e "for (const [name, v] of Object.entries(require('./npm-audit.json').vulnerabilities || {})) console.log(name, v.severity, v.range, JSON.stringify(v.fixAvailable))"

      - name: Production build
        run: npm run build

      - name: Unit tests (Vitest)
        run: npm test

      - name: Install isolated PDF inspection tools
        shell: bash
        run: |
          set -euo pipefail
          docker pull minidocks/poppler:latest
          POPPLER_IMAGE="$(docker image inspect --format '{{index .RepoDigests 0}}' minidocks/poppler:latest)"
          test -n "$POPPLER_IMAGE"
          mkdir -p "$HOME/.local/bin"
          for tool in pdfinfo pdftotext pdftoppm pdfimages; do
            cat > "$HOME/.local/bin/$tool" <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          exec docker run --rm --network none --user "$(id -u):$(id -g)" -v "$PWD:/app" -w /app "$POPPLER_IMAGE" "$tool" "\$@"
          EOF
            chmod 0755 "$HOME/.local/bin/$tool"
          done
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "Poppler tools pinned to the pulled image digest: $POPPLER_IMAGE"

      - name: Inspect all 33 PDF files and render first-page screenshots
        run: python3 tests/integration/inspect-pdfs.py

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: magnisa-verification-evidence
          path: |
            npm-audit.json
            test-results/interaction-registry.json
            test-results/document-presets-pdf.json
            test-results/pdf/*.pdf
            test-results/previews/*.png
            test-results/logos/*.pdf
