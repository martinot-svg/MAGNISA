name: MAGNISA CI

on:
  push:
    branches: [main, 'fix/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: magnisa-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_APP_URL: https://magnisa.vercel.app
      NEXT_PUBLIC_SUPABASE_URL: https://pmlzirobpdlzsrvtkvir.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_pL2Aw_tHI8kletdh9PquVg__JDKmDw9
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate production migration scripts syntax
        run: |
          bash -n scripts/ci/check-production-migration-history.sh
          bash -n scripts/ci/apply-production-allowlist.sh

      - name: Test production migration history reconciliation fixtures
        run: bash tests/ci/check-production-migration-history.test.sh

      - name: Generate exhaustive static interaction registry
        run: node scripts/qa/build-interaction-registry.mjs

      - name: Dependency audit report
        run: |
          npm audit --json > npm-audit.json || true
          node -e "for (const [name, v] of Object.entries(require('./npm-audit.json').vulnerabilities || {})) console.log(name, v.severity, v.range, JSON.stringify(v.fixAvailable))"

      - name: Production build
        run: npm run build

      - name: Unit tests (Vitest)
        run: npm test

      - name: Install isolated PDF inspection tools
        shell: bash
        run: |
          set -euo pipefail
          docker pull minidocks/poppler:latest
          POPPLER_IMAGE="$(docker image inspect --format '{{index .RepoDigests 0}}' minidocks/poppler:latest)"
          test -n "$POPPLER_IMAGE"
          mkdir -p "$HOME/.local/bin"
          for tool in pdfinfo pdftotext pdftoppm pdfimages; do
            cat > "$HOME/.local/bin/$tool" <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          exec docker run --rm --network none --user "$(id -u):$(id -g)" -v "$PWD:/app" -w /app "$POPPLER_IMAGE" "$tool" "\$@"
          EOF
            chmod 0755 "$HOME/.local/bin/$tool"
          done
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "Poppler tools pinned to the pulled image digest: $POPPLER_IMAGE"

      - name: Inspect all 33 PDF files and render first-page screenshots
        run: python3 tests/integration/inspect-pdfs.py

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: magnisa-verification-evidence
          path: |
            npm-audit.json
            test-results/interaction-registry.json
            test-results/document-presets-pdf.json
            test-results/pdf/*.pdf
            test-results/previews/*.png
            test-results/logos/*.pdf
