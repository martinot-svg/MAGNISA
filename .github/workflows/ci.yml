name: MAGNISA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: magnisa-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_APP_URL: https://magnisa.vercel.app
      NEXT_PUBLIC_SUPABASE_URL: https://pmlzirobpdlzsrvtkvir.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_pL2Aw_tHI8kletdh9PquVg__JDKmDw9
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Unit tests (Vitest)
        run: npm test

      - name: Install PDF inspection tools
        run: command -v pdftotext || (sudo apt-get update && sudo apt-get install -y poppler-utils)

      - name: Inspect all 32 PDF files and render first-page screenshots
        run: python3 tests/integration/inspect-pdfs.py

      - name: Upload PDF verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: document-presets-pdf-evidence
          path: |
            test-results/document-presets-pdf.json
            test-results/pdf/*.pdf
            test-results/previews/*.png
            test-results/logos/*.pdf
