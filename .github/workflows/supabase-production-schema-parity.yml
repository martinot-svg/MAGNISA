name: Supabase Production schema parity (read-only)

on:
  push:
    branches:
      - main
      - fix/production-schema-parity-audit
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-production-schema-parity.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: magnisa-production-schema-parity
  cancel-in-progress: false

jobs:
  compare-public-schema:
    name: Compare clean replay with Production (read-only)
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fix/production-schema-parity-audit'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SUPABASE_DB_PASSWORD: \${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify database credential
        shell: bash
        run: test -n "$SUPABASE_DB_PASSWORD" || (echo "::error::Secret SUPABASE_DB_PASSWORD manquant"; exit 1)

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 3.0.0

      - name: Start isolated PostgreSQL 17 stack
        run: supabase start -x studio,edge-runtime,logflare,vector,analytics

      - name: Replay all timestamped migrations from zero
        run: supabase db reset --yes

      - name: Build an encoded read-only Production connection URL
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from urllib.parse import quote
          password = quote(os.environ["SUPABASE_DB_PASSWORD"], safe="")
          url = f"postgresql://postgres.pmlzirobpdlzsrvtkvir:{password}@aws-1-us-west-2.pooler.supabase.com:5432/postgres?sslmode=require"
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              print(f"PRODUCTION_DB_URL={url}", file=env_file)
          PY

      - name: Compare all public schema objects and privileges
        shell: bash
        run: |
          set -euo pipefail
          DB_CONTAINER="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)"
          test -n "$DB_CONTAINER" || (echo "::error::Conteneur PostgreSQL local introuvable"; exit 1)
          docker exec "$DB_CONTAINER" pg_dump --version
          docker exec "$DB_CONTAINER" pg_dump --schema-only --schema=public --no-owner --no-comments --quote-all-identifiers -U postgres postgres > /tmp/local-public-schema.sql
          docker exec -e PRODUCTION_DB_URL="$PRODUCTION_DB_URL" "$DB_CONTAINER" sh -lc 'pg_dump "$PRODUCTION_DB_URL" --schema-only --schema=public --no-owner --no-comments --quote-all-identifiers' > /tmp/production-public-schema.sql
          if ! diff -u /tmp/production-public-schema.sql /tmp/local-public-schema.sql > /tmp/public-schema-diff.txt; then
            echo "::error::Le schéma public de Production diffère du replay local propre."
            echo "Diff stocké dans l'artefact production-public-schema-diff."
            exit 1
          fi
          echo "Production public schema exactly matches the clean local replay."

      - name: Upload schema diff on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-public-schema-diff
          path: /tmp/public-schema-diff.txt
          if-no-files-found: warn

      - name: Stop isolated Supabase
        if: always()
        run: supabase stop --no-backup
