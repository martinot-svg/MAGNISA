name: Repair Next.js SWC lockfile
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-swc-lockfile.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate complete npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate SWC packages
        run: node -e "const p=require('./package-lock.json').packages; if(!p['node_modules/@next/swc-linux-x64-gnu'] || !p['node_modules/@next/swc-linux-x64-musl']) process.exit(1)"
      - name: Commit regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(build): lock SWC dependencies"
            git push
          fi
