name: Synchronisation des dépendances Motion
on:
  push:
    branches: ['feat/magnisa-neumorphism-motion']
    paths:
      - package.json
      - .github/workflows/magnisa-motion-lock.yml
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/magnisa-neumorphism-motion
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Installer npm du projet
        run: npm install --global npm@10.9.2
      - name: Résoudre les dépendances officielles sans exécuter de scripts
        run: npm install motion@14.12.0 --save-exact --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Vérifier le verrouillage Motion et Next.js
        run: |
          node scripts/ci/check-next-swc-lockfile.mjs
          node -e "const p=require('./package.json'),l=require('./package-lock.json');if(p.dependencies.motion!=='14.12.0'||l.packages['node_modules/motion']?.version!=='14.12.0')process.exit(1)"
      - name: Enregistrer le lockfile sur la branche dédiée
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(ui): lock Motion official npm dependencies"
            git push origin HEAD:feat/magnisa-neumorphism-motion
          fi
