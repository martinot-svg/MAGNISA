name: Dependency security audit
on:
  push:
    branches:
      - fix/security-prospects-commissions
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve dependencies like the Vercel build
        run: npx --yes npm@11.19.1 install --no-package-lock
      - name: Create lockfile for the resolved dependency graph
        run: npx --yes npm@11.19.1 install --package-lock-only --ignore-scripts
      - name: Commit regenerated lockfile
        shell: bash
        run: |
          git fetch origin "$GITHUB_REF_NAME"
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo "A newer commit exists; this run will not write the lockfile."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current."
          else
            git commit -m "chore(deps): refresh lockfile [skip ci]"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Print complete npm audit findings
        shell: bash
        run: |
          npx --yes npm@11.19.1 audit --json > npm-audit.json || true
          node <<'NODE'
          const report = require('./npm-audit.json');
          console.log('VULNERABILITY_COUNTS', JSON.stringify(report.metadata?.vulnerabilities ?? {}));
          for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
            console.log(JSON.stringify({
              package: name,
              severity: item.severity,
              direct: item.isDirect,
              range: item.range,
              fixAvailable: item.fixAvailable,
              via: item.via.map(v => typeof v === 'string' ? v : {
                name: v.name, title: v.title, range: v.range, url: v.url, cwe: v.cwe, cvss: v.cvss?.score
              })
            }));
          }
          NODE
      - name: Fail on high or critical vulnerabilities
        run: npx --yes npm@11.19.1 audit --audit-level=high
