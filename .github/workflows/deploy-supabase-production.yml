name: Deploy Supabase production migrations

on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - "scripts/ci/check-production-migration-history.sh"
      - ".github/workflows/deploy-supabase-production.yml"
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Choisis DRY_RUN pour contrôler les migrations ou APPLY pour les appliquer après validation"
        required: true
        type: choice
        options:
          - NO
          - DRY_RUN
          - APPLY
        default: NO

permissions:
  contents: read

concurrency:
  group: magnisa-supabase-production-migrations
  cancel-in-progress: false

jobs:
  dry-run:
    name: Production migration preflight (read-only)
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.confirm_production == 'DRY_RUN' || inputs.confirm_production == 'APPLY')
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_PROJECT_REF: pmlzirobpdlzsrvtkvir
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Verify required credentials are configured
        shell: bash
        run: |
          test -n "$SUPABASE_DB_PASSWORD" || (echo "::error::Secret SUPABASE_DB_PASSWORD manquant"; exit 1)
          test -n "$SUPABASE_DB_URL" || (echo "::error::Secret SUPABASE_DB_URL manquant"; exit 1)

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Install pinned Supabase CLI
        run: npm install --global supabase@3.0.0

      - name: Build an encoded direct database URL
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from urllib.parse import quote
          password = quote(os.environ["SUPABASE_DB_PASSWORD"], safe="")
          url = f"postgresql://postgres.pmlzirobpdlzsrvtkvir:{password}@aws-1-us-west-2.pooler.supabase.com:5432/postgres?sslmode=require"
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              print(f"SUPABASE_DB_URL={url}", file=env_file)
          PY

      - name: Show pending migrations without applying them
        run: |
          echo "READ-ONLY PREFLIGHT: aucune migration ne sera appliquée par ce job."
          supabase db push --db-url "$SUPABASE_DB_URL" --include-all --dry-run

      - name: Verify remote migration history
        run: supabase migration list --db-url "$SUPABASE_DB_URL"

      - name: Block unreviewed migration history drift
        run: bash scripts/ci/check-production-migration-history.sh

  apply:
    name: Apply production migrations (explicit approval)
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_production == 'APPLY'
    needs: dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Verify required credentials are configured
        shell: bash
        run: |
          test -n "$SUPABASE_DB_PASSWORD" || (echo "::error::Secret SUPABASE_DB_PASSWORD manquant"; exit 1)

      - name: Install pinned Supabase CLI
        run: npm install --global supabase@3.0.0

      - name: Build an encoded direct database URL
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from urllib.parse import quote
          password = quote(os.environ["SUPABASE_DB_PASSWORD"], safe="")
          url = f"postgresql://postgres.pmlzirobpdlzsrvtkvir:{password}@aws-1-us-west-2.pooler.supabase.com:5432/postgres?sslmode=require"
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              print(f"SUPABASE_DB_URL={url}", file=env_file)
          PY

      - name: Apply pending migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL" --include-all --yes

      - name: Verify remote migration history
        run: supabase migration list --db-url "$SUPABASE_DB_URL"
