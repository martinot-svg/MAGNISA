name: Deploy Supabase production migrations

on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - "scripts/ci/check-production-migration-history.sh"
      - "scripts/ci/apply-production-allowlist.sh"
      - ".github/workflows/deploy-supabase-production.yml"
      - ".github/workflows/backup-supabase-production.yml"
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Choisis DRY_RUN pour contrôler les migrations ou APPLY pour les appliquer après sauvegarde vérifiée"
        required: true
        type: choice
        options:
          - NO
          - DRY_RUN
          - APPLY
        default: NO

permissions:
  contents: read
  actions: read

concurrency:
  group: magnisa-supabase-production-migrations
  cancel-in-progress: false

jobs:
  dry-run:
    name: Production migration preflight (read-only)
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.confirm_production == 'DRY_RUN' || inputs.confirm_production == 'APPLY')
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Verify required credential
        shell: bash
        run: |
          test -n "$SUPABASE_DB_PASSWORD" || { echo "::error::Secret SUPABASE_DB_PASSWORD manquant"; exit 1; }

      - name: Provide PostgreSQL client through the pinned Docker image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          cat > "$HOME/.local/bin/psql" <<'PSQL_WRAPPER'
          #!/usr/bin/env bash
          set -euo pipefail
          exec docker run --rm -i --network host \
            -e PGSSLMODE="${PGSSLMODE:-require}" \
            postgres:17 psql "$@"
          PSQL_WRAPPER
          chmod 0755 "$HOME/.local/bin/psql"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "PostgreSQL client wrapper configured without Ubuntu package repositories."

      - name: Build an encoded direct database URL
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from urllib.parse import quote
          password = quote(os.environ["SUPABASE_DB_PASSWORD"], safe="")
          url = f"postgresql://postgres.pmlzirobpdlzsrvtkvir:{password}@aws-1-us-west-2.pooler.supabase.com:5432/postgres?sslmode=require"
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              print(f"SUPABASE_DB_URL={url}", file=env_file)
          PY

      - name: Require complete historical migration reconciliation (read-only)
        shell: bash
        run: bash scripts/ci/check-production-migration-history.sh

      - name: Validate and dry-run only the approved migration allowlist
        run: bash scripts/ci/apply-production-allowlist.sh dry-run

  apply:
    name: Apply production migrations (explicit approval)
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_production == 'APPLY'
    needs: dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Verify required credential
        shell: bash
        run: |
          test -n "$SUPABASE_DB_PASSWORD" || { echo "::error::Secret SUPABASE_DB_PASSWORD manquant"; exit 1; }

      - name: Provide PostgreSQL client through the pinned Docker image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          cat > "$HOME/.local/bin/psql" <<'PSQL_WRAPPER'
          #!/usr/bin/env bash
          set -euo pipefail
          exec docker run --rm -i --network host \
            -e PGSSLMODE="${PGSSLMODE:-require}" \
            postgres:17 psql "$@"
          PSQL_WRAPPER
          chmod 0755 "$HOME/.local/bin/psql"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "PostgreSQL client wrapper configured without Ubuntu package repositories."

      - name: Build an encoded direct database URL
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from urllib.parse import quote
          password = quote(os.environ["SUPABASE_DB_PASSWORD"], safe="")
          url = f"postgresql://postgres.pmlzirobpdlzsrvtkvir:{password}@aws-1-us-west-2.pooler.supabase.com:5432/postgres?sslmode=require"
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              print(f"SUPABASE_DB_URL={url}", file=env_file)
          PY

      - name: Require encrypted backup for the exact release commit
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "backup-supabase-production.yml",
              branch: "main",
              status: "success",
              per_page: 10
            });
            const backupRun = runs.data.workflow_runs.find(run =>
              run.head_sha === context.sha && run.conclusion === "success"
            );
            if (!backupRun) {
              core.setFailed("Aucune sauvegarde vérifiée pour le commit exact en cours de déploiement.");
              return;
            }
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: backupRun.id
            });
            const backup = artifacts.data.artifacts.find(item =>
              item.name === "magnisa-supabase-production-encrypted-backup" && !item.expired
            );
            if (!backup) core.setFailed("Archive chiffrée de sauvegarde introuvable.");

      - name: Revalidate complete migration history immediately before apply
        run: bash scripts/ci/check-production-migration-history.sh

      - name: Apply only the approved migration allowlist
        run: bash scripts/ci/apply-production-allowlist.sh apply

      - name: Verify production schema, accounting mappings and reconciliations
        shell: bash
        run: |
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -At <<'SQL'
          DO $$
          BEGIN
            IF to_regclass('public.pcg2005_balance_sheet_rules') IS NULL
              OR to_regclass('public.pcg2005_balance_sheet_passif_rules') IS NULL
              OR to_regclass('public.inventory_counts') IS NULL
              OR to_regclass('public.inventory_count_lines') IS NULL
              OR to_regclass('public.pcg2005_supplier_invoice_mappings') IS NULL
              OR to_regclass('public.pcg2005_expense_mappings') IS NULL THEN
              RAISE EXCEPTION 'Required balance-sheet, inventory or source-mapping schema is missing';
            END IF;

            IF (
              SELECT count(*) FROM public.pcg2005_journal_lines
              WHERE reference IN ('FOUR-1','FOUR-9898')
                AND pcg_code IS NULL
                AND mapping_status='a_mapper'
            ) <> 2 THEN
              RAISE EXCEPTION 'Undocumented generic supplier invoices FOUR-1 and FOUR-9898 must remain unmapped, not classified as fixed assets';
            END IF;
            IF EXISTS (
              SELECT 1 FROM public.journal_entries
              WHERE status='posted' AND abs(total_debit-total_credit)>=0.01
            ) THEN
              RAISE EXCEPTION 'Unbalanced posted journal entry detected';
            END IF;

            IF EXISTS (
              SELECT organization_id
              FROM public.pcg2005_journal_lines
              WHERE status='posted'
                AND source_type IN ('internal_transfer_debit','internal_transfer_credit')
                AND account_key LIKE 'TRANSIT:%'
                AND pcg_code='581'
              GROUP BY organization_id
              HAVING abs(sum(debit-credit)) >= 0.01
            ) THEN
              RAISE EXCEPTION 'Internal-transfer clearing entries do not net to zero on PCG 581 for each organization';
            END IF;

            IF EXISTS (
              SELECT sp.id
              FROM public.supplier_payments sp
              LEFT JOIN public.journal_entries je
                ON je.source_id=sp.id AND je.source_type='supplier_payment'
              GROUP BY sp.id,sp.amount
              HAVING count(je.id)<>1
                OR abs(COALESCE(max(je.total_debit),0)-sp.amount)>=0.01
                OR abs(COALESCE(max(je.total_credit),0)-sp.amount)>=0.01
            ) THEN
              RAISE EXCEPTION 'Supplier payment does not have exactly one balanced journal entry';
            END IF;

            IF EXISTS (
              SELECT si.id
              FROM public.supplier_invoices si
              LEFT JOIN public.supplier_payments sp ON sp.supplier_invoice_id=si.id
              GROUP BY si.id,si.paid_amount
              HAVING abs(si.paid_amount-COALESCE(sum(sp.amount),0))>=0.01
            ) THEN
              RAISE EXCEPTION 'Supplier invoice paid amount does not reconcile to its payment rows';
            END IF;

            IF EXISTS (
              SELECT fa.id
              FROM public.financial_accounts fa
              LEFT JOIN public.financial_transactions ft
                ON ft.organization_id=fa.organization_id
               AND ft.financial_account_id=fa.id
              GROUP BY fa.id,fa.balance
              HAVING abs(fa.balance-COALESCE(sum(ft.amount),0))>=0.01
            ) THEN
              RAISE EXCEPTION 'Treasury subledger balance does not reconcile to its movements';
            END IF;

            IF EXISTS (
              WITH financial_by_code AS (
                SELECT organization_id,pcg_account_code,sum(balance) financial_balance
                FROM public.financial_accounts
                WHERE pcg_account_code IS NOT NULL
                GROUP BY organization_id,pcg_account_code
              ),
              ledger_by_code AS (
                SELECT organization_id,pcg_code,sum(debit-credit) ledger_balance
                FROM public.pcg2005_journal_lines
                WHERE status='posted'
                  AND pcg_code ~ '^(511|512|515|517|518|53|54)$'
                GROUP BY organization_id,pcg_code
              ),
              comparison AS (
                SELECT COALESCE(f.organization_id,l.organization_id) organization_id,
                  COALESCE(f.pcg_account_code,l.pcg_code) pcg_code,
                  COALESCE(f.financial_balance,0)-COALESCE(l.ledger_balance,0) difference
                FROM financial_by_code f
                FULL OUTER JOIN ledger_by_code l
                  ON l.organization_id=f.organization_id AND l.pcg_code=f.pcg_account_code
              )
              SELECT 1 FROM comparison WHERE abs(difference)>=0.01
            ) THEN
              RAISE EXCEPTION 'PCG class 5 balances do not reconcile to bank, cash and Mobile Money accounts';
            END IF;

            IF (
              SELECT count(*) FROM public.pcg2005_journal_lines
              WHERE reference IN ('FOUR-2030','FOUR-2031')
                AND organization_id IN (
                  SELECT DISTINCT organization_id FROM public.supplier_invoices
                  WHERE supplier_number IN ('2030','2031')
                )
                AND pcg_code='606'
                AND mapping_status='manuel'
                AND mapping_evidence_status='record_only'
                AND mapping_requires_attachment
            ) <> 2 THEN
              RAISE EXCEPTION 'FOUR-2030 and FOUR-2031 must map to PCG 606 and retain their missing-invoice evidence flags';
            END IF;

            IF (
              SELECT count(*) FROM public.pcg2005_journal_lines
              WHERE reference IN ('DEP-00003','DEP-00004')
                AND organization_id IN (
                  SELECT DISTINCT organization_id FROM public.expenses
                  WHERE magnisa_reference IN ('DEP-00003','DEP-00004')
                )
                AND pcg_code='218'
                AND mapping_status='manuel'
                AND mapping_evidence_status='record_only'
                AND mapping_requires_attachment
                AND mapping_requires_asset_register
                AND mapping_requires_useful_life
            ) <> 2 THEN
              RAISE EXCEPTION 'Computer acquisitions DEP-00003 and DEP-00004 must map provisionally to PCG 218 with evidence flags';
            END IF;

            IF (
              SELECT COALESCE(abs(sum(debit_difference)),0)
              FROM public.fixed_asset_register_reconciliation
              WHERE account_code='218'
                AND organization_id IN (
                  SELECT DISTINCT organization_id FROM public.expenses
                  WHERE magnisa_reference IN ('DEP-00003','DEP-00004')
                )
            ) <> 9000000 THEN
              RAISE EXCEPTION 'The 9,000,000 MGA computer asset register gap must remain visible and unmasked';
            END IF;

            IF (
              SELECT count(*) FROM supabase_migrations.schema_migrations
              WHERE version IN (
                '20261107170000','20261109170000','20261109290000','20261109300000',
                '20261110000000','20261110090000','20261110091500','20261110093000',
                '20261110094000','20261110095000','20261110100000',
                '20261112090000','20261112100000'
              )
            ) <> 13 THEN
              RAISE EXCEPTION 'Production migration ledger does not contain all eleven approved versions';
            END IF;
          END $$;
          SQL
