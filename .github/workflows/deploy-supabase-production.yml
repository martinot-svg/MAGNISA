name: Deploy Supabase production migrations

on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - "supabase/migrations/production-pending-allowlist.txt"
      - "scripts/ci/check-production-migration-history.sh"
      - "scripts/ci/apply-production-allowlist.sh"
      - ".github/workflows/deploy-supabase-production.yml"
      - ".github/workflows/backup-supabase-production.yml"
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Choisis DRY_RUN pour contrôler les migrations ou APPLY pour les appliquer après sauvegarde vérifiée"
        required: true
        type: choice
        options:
          - NO
          - DRY_RUN
          - APPLY
        default: NO
  workflow_run:
    workflows:
      - Encrypted Supabase Production Backup Verification
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  actions: read

concurrency:
  group: magnisa-supabase-production-migrations
  cancel-in-progress: false

jobs:
  dry-run:
    name: Production migration preflight (read-only)
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && (inputs.confirm_production == 'DRY_RUN' || inputs.confirm_production == 'APPLY')) || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success')
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Verify required credential
        shell: bash
        run: |
          test -n "$SUPABASE_DB_PASSWORD" || { echo "::error::Secret SUPABASE_DB_PASSWORD manquant"; exit 1; }

      - name: Provide PostgreSQL client through the pinned Docker image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          cat > "$HOME/.local/bin/psql" <<'PSQL_WRAPPER'
          #!/usr/bin/env bash
          set -euo pipefail
          exec docker run --rm -i --network host \
            -e PGSSLMODE="${PGSSLMODE:-require}" \
            postgres:17 psql "$@"
          PSQL_WRAPPER
          chmod 0755 "$HOME/.local/bin/psql"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "PostgreSQL client wrapper configured without Ubuntu package repositories."

      - name: Build an encoded direct database URL
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from urllib.parse import quote
          password = quote(os.environ["SUPABASE_DB_PASSWORD"], safe="")
          url = f"postgresql://postgres.pmlzirobpdlzsrvtkvir:{password}@aws-1-us-west-2.pooler.supabase.com:5432/postgres?sslmode=require"
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              print(f"SUPABASE_DB_URL={url}", file=env_file)
          PY

      - name: Require complete historical migration reconciliation (read-only)
        shell: bash
        run: bash scripts/ci/check-production-migration-history.sh

      - name: Validate and dry-run only the approved migration allowlist
        run: bash scripts/ci/apply-production-allowlist.sh dry-run

  apply:
    name: Apply production migrations after verified backup
    if: (github.event_name == 'workflow_dispatch' && inputs.confirm_production == 'APPLY') || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success')
    needs: dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Verify required credential
        shell: bash
        run: |
          test -n "$SUPABASE_DB_PASSWORD" || { echo "::error::Secret SUPABASE_DB_PASSWORD manquant"; exit 1; }

      - name: Provide PostgreSQL client through the pinned Docker image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          cat > "$HOME/.local/bin/psql" <<'PSQL_WRAPPER'
          #!/usr/bin/env bash
          set -euo pipefail
          exec docker run --rm -i --network host \
            -e PGSSLMODE="${PGSSLMODE:-require}" \
            postgres:17 psql "$@"
          PSQL_WRAPPER
          chmod 0755 "$HOME/.local/bin/psql"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "PostgreSQL client wrapper configured without Ubuntu package repositories."

      - name: Build an encoded direct database URL
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from urllib.parse import quote
          password = quote(os.environ["SUPABASE_DB_PASSWORD"], safe="")
          url = f"postgresql://postgres.pmlzirobpdlzsrvtkvir:{password}@aws-1-us-west-2.pooler.supabase.com:5432/postgres?sslmode=require"
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              print(f"SUPABASE_DB_URL={url}", file=env_file)
          PY

      - name: Require encrypted backup for the exact release commit
        uses: actions/github-script@v7
        with:
          script: |
            const workflowRun = context.eventName === "workflow_run"
              ? context.payload.workflow_run
              : null;
            let backupRun = workflowRun;

            if (workflowRun) {
              if (workflowRun.event !== "push"
                || workflowRun.head_branch !== "main"
                || workflowRun.conclusion !== "success") {
                core.setFailed("Automatic release requires a successful backup run from a main-branch push.");
                return;
              }
              const mainRef = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: "heads/main"
              });
              if (mainRef.data.object.sha !== workflowRun.head_sha) {
                core.setFailed("Main advanced after the backup; refusing to apply a stale release.");
                return;
              }
            } else {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: "backup-supabase-production.yml",
                branch: "main",
                status: "success",
                per_page: 10
              });
              backupRun = runs.data.workflow_runs.find(run =>
                run.head_sha === context.sha && run.conclusion === "success"
              );
            }

            if (!backupRun) {
              core.setFailed("Aucune sauvegarde vérifiée pour le commit exact en cours de déploiement.");
              return;
            }
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: backupRun.id
            });
            const backup = artifacts.data.artifacts.find(item =>
              item.name === "magnisa-supabase-production-encrypted-backup" && !item.expired
            );
            if (!backup) core.setFailed("Archive chiffrée de sauvegarde introuvable.");

      - name: Revalidate complete migration history immediately before apply
        run: bash scripts/ci/check-production-migration-history.sh

      - name: Apply only the approved migration allowlist
        run: bash scripts/ci/apply-production-allowlist.sh apply

      - name: Verify production schema, accounting mappings and reconciliations
        shell: bash
        run: |
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -At <<'SQL'
          DO $$
          BEGIN
            IF to_regclass('public.pcg2005_balance_sheet_rules') IS NULL
              OR to_regclass('public.pcg2005_balance_sheet_passif_rules') IS NULL
              OR to_regclass('public.inventory_counts') IS NULL
              OR to_regclass('public.inventory_count_lines') IS NULL
              OR to_regclass('public.pcg2005_supplier_invoice_mappings') IS NULL
              OR to_regclass('public.pcg2005_expense_mappings') IS NULL THEN
              RAISE EXCEPTION 'Required balance-sheet, inventory or source-mapping schema is missing';
            END IF;

            IF (
              SELECT count(*) FROM public.pcg2005_journal_lines
              WHERE reference IN ('FOUR-1','FOUR-9898')
                AND pcg_code IS NULL
                AND mapping_status='a_mapper'
            ) <> 2 THEN
              RAISE EXCEPTION 'Undocumented generic supplier invoices FOUR-1 and FOUR-9898 must remain unmapped, not classified as fixed assets';
            END IF;
            IF EXISTS (
              SELECT 1 FROM public.journal_entries
              WHERE status='posted' AND abs(total_debit-total_credit)>=0.01
            ) THEN
              RAISE EXCEPTION 'Unbalanced posted journal entry detected';
            END IF;

            IF EXISTS (
              SELECT organization_id
              FROM public.pcg2005_journal_lines
              WHERE status='posted'
                AND source_type IN ('internal_transfer_debit','internal_transfer_credit')
                AND account_key LIKE 'TRANSIT:%'
                AND pcg_code='581'
              GROUP BY organization_id
              HAVING abs(sum(debit-credit)) >= 0.01
            ) THEN
              RAISE EXCEPTION 'Internal-transfer clearing entries do not net to zero on PCG 581 for each organization';
            END IF;

            IF EXISTS (
              SELECT sp.id
              FROM public.supplier_payments sp
              LEFT JOIN public.journal_entries je
                ON je.source_id=sp.id AND je.source_type='supplier_payment'
              GROUP BY sp.id,sp.amount
              HAVING count(je.id)<>1
                OR abs(COALESCE(max(je.total_debit),0)-sp.amount)>=0.01
                OR abs(COALESCE(max(je.total_credit),0)-sp.amount)>=0.01
            ) THEN
              RAISE EXCEPTION 'Supplier payment does not have exactly one balanced journal entry';
            END IF;

            IF EXISTS (
              SELECT si.id
              FROM public.supplier_invoices si
              LEFT JOIN public.supplier_payments sp ON sp.supplier_invoice_id=si.id
              GROUP BY si.id,si.paid_amount
              HAVING abs(si.paid_amount-COALESCE(sum(sp.amount),0))>=0.01
            ) THEN
              RAISE EXCEPTION 'Supplier invoice paid amount does not reconcile to its payment rows';
            END IF;

            IF EXISTS (
              SELECT fa.id
              FROM public.financial_accounts fa
              LEFT JOIN public.financial_transactions ft
                ON ft.organization_id=fa.organization_id
               AND ft.financial_account_id=fa.id
              GROUP BY fa.id,fa.balance
              HAVING abs(fa.balance-COALESCE(sum(ft.amount),0))>=0.01
            ) THEN
              RAISE EXCEPTION 'Treasury subledger balance does not reconcile to its movements';
            END IF;

            IF EXISTS (
              WITH financial_by_code AS (
                SELECT organization_id,pcg_account_code,sum(balance) financial_balance
                FROM public.financial_accounts
                WHERE pcg_account_code IS NOT NULL
                GROUP BY organization_id,pcg_account_code
              ),
              ledger_by_code AS (
                SELECT organization_id,pcg_code,sum(debit-credit) ledger_balance
                FROM public.pcg2005_journal_lines
                WHERE status='posted'
                  AND pcg_code ~ '^(511|512|515|517|518|53|54)$'
                GROUP BY organization_id,pcg_code
              ),
              comparison AS (
                SELECT COALESCE(f.organization_id,l.organization_id) organization_id,
                  COALESCE(f.pcg_account_code,l.pcg_code) pcg_code,
                  COALESCE(f.financial_balance,0)-COALESCE(l.ledger_balance,0) difference
                FROM financial_by_code f
                FULL OUTER JOIN ledger_by_code l
                  ON l.organization_id=f.organization_id AND l.pcg_code=f.pcg_account_code
              )
              SELECT 1 FROM comparison WHERE abs(difference)>=0.01
            ) THEN
              RAISE EXCEPTION 'PCG class 5 balances do not reconcile to bank, cash and Mobile Money accounts';
            END IF;

            IF (
              SELECT count(*) FROM public.pcg2005_journal_lines
              WHERE reference IN ('FOUR-2030','FOUR-2031')
                AND organization_id IN (
                  SELECT DISTINCT organization_id FROM public.supplier_invoices
                  WHERE supplier_number IN ('2030','2031')
                )
                AND pcg_code='606'
                AND mapping_status='manuel'
                AND mapping_evidence_status='record_only'
                AND mapping_requires_attachment
            ) <> 2 THEN
              RAISE EXCEPTION 'FOUR-2030 and FOUR-2031 must map to PCG 606 and retain their missing-invoice evidence flags';
            END IF;

            IF (
              SELECT count(*) FROM public.pcg2005_journal_lines
              WHERE reference IN ('DEP-00003','DEP-00004')
                AND organization_id IN (
                  SELECT DISTINCT organization_id FROM public.expenses
                  WHERE magnisa_reference IN ('DEP-00003','DEP-00004')
                )
                AND pcg_code='218'
                AND mapping_status='manuel'
                AND mapping_evidence_status='record_only'
                AND mapping_requires_attachment
                AND mapping_requires_asset_register
                AND mapping_requires_useful_life
            ) <> 2 THEN
              RAISE EXCEPTION 'Computer acquisitions DEP-00003 and DEP-00004 must map provisionally to PCG 218 with evidence flags';
            END IF;

            IF (
              SELECT COALESCE(abs(sum(debit_difference)),0)
              FROM public.fixed_asset_register_reconciliation
              WHERE account_code='218'
                AND organization_id IN (
                  SELECT DISTINCT organization_id FROM public.expenses
                  WHERE magnisa_reference IN ('DEP-00003','DEP-00004')
                )
            ) <> 9000000 THEN
              RAISE EXCEPTION 'The 9,000,000 MGA computer asset register gap must remain visible and unmasked';
            END IF;

            IF (
              SELECT count(*) FROM supabase_migrations.schema_migrations
              WHERE version IN (
                '20261107170000','20261109170000','20261109290000','20261109300000',
                '20261110000000','20261110090000','20261110091500','20261110093000',
                '20261110094000','20261110095000','20261110100000',
                '20261112090000','20261112100000',
                '20261126110000','20261126220000','20261127000000','20261129000000'
              )
            ) <> 17 THEN
              RAISE EXCEPTION 'Production migration ledger does not contain all seventeen approved versions';
            END IF;


            IF to_regprocedure('public.magnibox_has_internal_reader(uuid,uuid)') IS NULL
              OR to_regprocedure('public.magnibox_list_deliverable_mailboxes(uuid)') IS NULL
              OR to_regprocedure('public.magnibox_can_send_internal(uuid,uuid,uuid)') IS NULL THEN
              RAISE EXCEPTION 'MAGNIBOX internal mailbox permission functions are missing';
            END IF;

            IF to_regprocedure('private.magnisa_generate_username(text,text)') IS NULL
              OR to_regprocedure('private.magnisa_issue_profile_id()') IS NULL
              OR to_regprocedure('public.claim_magnisa_identity(text,text,text,text)') IS NULL THEN
              RAISE EXCEPTION 'MAGNISA username identity functions are missing';
            END IF;

            IF NOT has_function_privilege('authenticated','public.claim_magnisa_identity(text,text,text,text)','EXECUTE')
              OR has_function_privilege('anon','public.claim_magnisa_identity(text,text,text,text)','EXECUTE')
              OR has_function_privilege('authenticated','private.magnisa_generate_username(text,text)','EXECUTE')
              OR has_function_privilege('anon','private.magnisa_generate_username(text,text)','EXECUTE') THEN
              RAISE EXCEPTION 'MAGNISA identity function grants violate the least-privilege contract';
            END IF;

            IF to_regprocedure('public.get_my_organization_invitations()') IS NULL
              OR to_regprocedure('public.respond_to_organization_invitation(uuid,boolean)') IS NULL THEN
              RAISE EXCEPTION 'Organization invitation RPCs are missing';
            END IF;

            IF NOT has_function_privilege('authenticated','public.respond_to_organization_invitation(uuid,boolean)','EXECUTE')
              OR has_function_privilege('anon','public.respond_to_organization_invitation(uuid,boolean)','EXECUTE') THEN
              RAISE EXCEPTION 'Organization invitation RPC grants violate the least-privilege contract';
            END IF;

            IF to_regclass('public.company_settings_member_view') IS NULL THEN
              RAISE EXCEPTION 'Permission-aware company settings view is missing';
            END IF;

            IF NOT EXISTS (
              SELECT 1 FROM pg_class c
              JOIN pg_namespace n ON n.oid = c.relnamespace
              WHERE n.nspname = 'public'
                AND c.relname = 'company_settings_member_view'
                AND c.reloptions @> ARRAY['security_barrier=true']
            ) THEN
              RAISE EXCEPTION 'Company settings member view must use security_barrier';
            END IF;

            IF NOT has_table_privilege('authenticated','public.company_settings_member_view','SELECT')
              OR has_table_privilege('anon','public.company_settings_member_view','SELECT') THEN
              RAISE EXCEPTION 'Company settings member view grants are incorrect';
            END IF;

            IF (
              SELECT count(*) FROM pg_policies
              WHERE schemaname = 'public'
                AND tablename = 'company_settings'
                AND policyname IN (
                  'company_settings_admin_select_guard',
                  'company_settings_admin_insert_guard',
                  'company_settings_admin_update_guard'
                )
                AND permissive = 'RESTRICTIVE'
            ) <> 3 THEN
              RAISE EXCEPTION 'Company settings raw-table restrictive guards are missing';
            END IF;

            IF NOT EXISTS (
              SELECT 1 FROM pg_constraint
              WHERE conrelid = 'public.organization_members'::regclass
                AND conname = 'organization_members_status_check'
                AND pg_get_constraintdef(oid) ILIKE '%invited%'
                AND pg_get_constraintdef(oid) ILIKE '%declined%'
            ) THEN
              RAISE EXCEPTION 'Organization invitation membership states are missing';
            END IF;

            IF NOT EXISTS (
              SELECT 1 FROM pg_policies
              WHERE schemaname = 'public'
                AND tablename = 'notifications'
                AND policyname = 'notifications_select_own'
                AND position('invited' in coalesce(qual,'')) > 0
            ) OR NOT EXISTS (
              SELECT 1 FROM pg_policies
              WHERE schemaname = 'public'
                AND tablename = 'notifications'
                AND policyname = 'notifications_update_own'
                AND position('invited' in coalesce(qual,'')) > 0
            ) THEN
              RAISE EXCEPTION 'Pending invitation notification policies are missing';
            END IF;

            IF NOT EXISTS (
              SELECT 1 FROM pg_policies
              WHERE schemaname = 'public'
                AND tablename = 'magnibox_internal_messages'
                AND policyname = 'magnibox_messages_select'
                AND position('sender_mailbox_id' in coalesce(qual,'')) > 0
                AND position('send' in coalesce(qual,'')) > 0
            ) THEN
              RAISE EXCEPTION 'MAGNIBOX sent-folder read policy is missing';
            END IF;


            IF NOT EXISTS (
              SELECT 1 FROM public.pcg2005_balance_sheet_rules
              WHERE account_code='4456' AND section='current_assets'
                AND line_key='tax_and_public_authority_balances' AND normal_side='debit'
            ) OR NOT EXISTS (
              SELECT 1 FROM public.pcg2005_balance_sheet_rules
              WHERE account_code='4457' AND section='current_liabilities'
                AND line_key='tax_payables' AND normal_side='credit'
            ) OR NOT EXISTS (
              SELECT 1 FROM public.pcg2005_balance_sheet_passif_rules
              WHERE account_code='4457' AND section='current_liabilities'
                AND line_key='tax_payables' AND normal_side='credit'
            ) THEN
              RAISE EXCEPTION 'PCG 4456/4457 balance-sheet classifications are incomplete';
            END IF;

            IF EXISTS (SELECT 1 FROM public.pcg2005_balance_sheet_mapping_gaps)
               OR EXISTS (SELECT 1 FROM public.pcg2005_balance_sheet_passif_mapping_gaps) THEN
              RAISE EXCEPTION 'Unmapped PCG balance-sheet presentation accounts remain';
            END IF;
          END $$;
          SQL
