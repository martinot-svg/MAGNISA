name: Deploy Supabase production migrations

on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - "scripts/ci/check-production-migration-history.sh"
      - "scripts/ci/apply-production-allowlist.sh"
      - ".github/workflows/deploy-supabase-production.yml"
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Choisis DRY_RUN pour contrôler les migrations ou APPLY pour les appliquer après validation"
        required: true
        type: choice
        options:
          - NO
          - DRY_RUN
          - APPLY
        default: NO

permissions:
  contents: read
  actions: read

concurrency:
  group: magnisa-supabase-production-migrations
  cancel-in-progress: false

jobs:
  dry-run:
    name: Production migration preflight (read-only)
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.confirm_production == 'DRY_RUN' || inputs.confirm_production == 'APPLY')
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: pmlzirobpdlzsrvtkvir
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Verify required credential
        shell: bash
        run: |
          test -n "$SUPABASE_DB_PASSWORD" || (echo "::error::Secret SUPABASE_DB_PASSWORD manquant"; exit 1)

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Install pinned Supabase CLI
        run: npm install --global supabase@3.0.0

      - name: Build an encoded direct database URL
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from urllib.parse import quote
          password = quote(os.environ["SUPABASE_DB_PASSWORD"], safe="")
          url = f"postgresql://postgres.pmlzirobpdlzsrvtkvir:{password}@aws-1-us-west-2.pooler.supabase.com:5432/postgres?sslmode=require"
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              print(f"SUPABASE_DB_URL={url}", file=env_file)
          PY

      - name: Audit complete historical migration drift (non-blocking)
        shell: bash
        run: |
          if bash scripts/ci/check-production-migration-history.sh; then
            echo "Complete migration history is reconciled."
          else
            echo "::warning::Historical migration drift remains. Only the explicit production allowlist is eligible for this release."
          fi

      - name: Validate and dry-run only the approved migration allowlist
        run: bash scripts/ci/apply-production-allowlist.sh dry-run

      - name: Verify Supabase CLI migration list
        run: supabase migration list --db-url "$SUPABASE_DB_URL"

  apply:
    name: Apply production migrations (explicit approval)
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_production == 'APPLY'
    needs: dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Verify required credential
        shell: bash
        run: |
          test -n "$SUPABASE_DB_PASSWORD" || (echo "::error::Secret SUPABASE_DB_PASSWORD manquant"; exit 1)

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Install pinned Supabase CLI
        run: npm install --global supabase@3.0.0

      - name: Build an encoded direct database URL
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from urllib.parse import quote
          password = quote(os.environ["SUPABASE_DB_PASSWORD"], safe="")
          url = f"postgresql://postgres.pmlzirobpdlzsrvtkvir:{password}@aws-1-us-west-2.pooler.supabase.com:5432/postgres?sslmode=require"
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              print(f"SUPABASE_DB_URL={url}", file=env_file)
          PY

      - name: Require a recent verified production backup
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "backup-supabase-production.yml",
              branch: "main",
              status: "success",
              per_page: 10
            });
            const cutoff = Date.now() - 24 * 60 * 60 * 1000;
            const recent = runs.data.workflow_runs.find(run => Date.parse(run.created_at) >= cutoff);
            if (!recent) {
              core.setFailed("Aucune sauvegarde de production vérifiée au cours des dernières 24 heures.");
              return;
            }
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: recent.id
            });
            const backup = artifacts.data.artifacts.find(item =>
              item.name === "magnisa-supabase-production-encrypted-backup" && !item.expired
            );
            if (!backup) core.setFailed("Archive chiffrée de sauvegarde introuvable.");

      - name: Apply only the approved migration allowlist
        run: bash scripts/ci/apply-production-allowlist.sh apply

      - name: Verify remote migration history
        run: supabase migration list --db-url "$SUPABASE_DB_URL"
