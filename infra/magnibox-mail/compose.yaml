services:
  mailserver:
    image: ${MAGNIBOX_DMS_IMAGE:?Set a pinned Docker Mailserver version or image digest}
    container_name: magnibox-mailserver
    hostname: ${MAGNIBOX_MTA_HOSTNAME:?Set the public mail FQDN}
    env_file:
      - ./mailserver.env
    environment:
      OVERRIDE_HOSTNAME: ${MAGNIBOX_MTA_HOSTNAME:?Set the public mail FQDN}
    ports:
      - "25:25"
      - "587:587"
      - "993:993"
    volumes:
      - ./docker-data/mail-data:/var/mail/
      - ./docker-data/mail-state:/var/mail-state/
      - ./docker-data/logs:/var/log/mail/
      - ./docker-data/config:/tmp/docker-mailserver/
      - ./bridge:/opt/magnibox-bridge:ro
      - ${MAGNIBOX_TLS_DIR:?Set the host directory containing the TLS certificate and key}:/run/magnibox-tls:ro
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    stop_grace_period: 1m

  delivery-events:
    image: ${MAGNIBOX_FORWARDER_IMAGE:?Set a pinned Python runtime image digest}
    profiles: ["delivery-events"]
    container_name: magnibox-delivery-events
    entrypoint: ["python3", "/opt/magnibox-bridge/postfix-delivery-events.py"]
    command: ["/var/log/mail/mail.log", "/var/lib/magnibox-event-forwarder/cursor.json"]
    environment:
      MAGNIBOX_DELIVERY_EVENT_URL: ${MAGNIBOX_DELIVERY_EVENT_URL:?Set the internal MAGNIBOX delivery-event endpoint}
      MAGNIBOX_INBOUND_WEBHOOK_SECRET: ${MAGNIBOX_INBOUND_WEBHOOK_SECRET:?Set the shared HMAC secret}
    volumes:
      - ./docker-data/logs:/var/log/mail:ro
      - ./bridge:/opt/magnibox-bridge:ro
      - ./docker-data/event-forwarder:/var/lib/magnibox-event-forwarder
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
