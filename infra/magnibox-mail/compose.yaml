services:
  mailserver:
    image: ${MAGNIBOX_DMS_IMAGE:?Set a pinned Docker Mailserver version or image digest}
    container_name: magnibox-mailserver
    hostname: ${MAGNIBOX_MTA_HOSTNAME:?Set the public mail FQDN}
    env_file:
      - ./mailserver.env
    environment:
      OVERRIDE_HOSTNAME: ${MAGNIBOX_MTA_HOSTNAME:?Set the public mail FQDN}
    ports:
      - "25:25"
      - "587:587"
      - "993:993"
    volumes:
      - ./docker-data/mail-data:/var/mail/
      - ./docker-data/mail-state:/var/mail-state/
      - ./docker-data/logs:/var/log/mail/
      - ./docker-data/config:/tmp/docker-mailserver/
      - ./bridge:/opt/magnibox-bridge:ro
      - ${MAGNIBOX_TLS_DIR:?Set the host directory containing the TLS certificate and key}:/run/magnibox-tls:ro
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    stop_grace_period: 1m

  attachment-worker:
    build:
      context: ../..
      dockerfile: infra/magnibox-mail/worker/Dockerfile
    network_mode: "service:mailserver"
    depends_on:
      - mailserver
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${MAGNIBOX_WORKER_SUPABASE_URL:?Set the Supabase project URL}
      SUPABASE_SERVICE_ROLE_KEY: ${MAGNIBOX_WORKER_SERVICE_ROLE_KEY:?Set the server-only Supabase service role key}
      MAGNIBOX_CLAMAV_HOST: 127.0.0.1
      MAGNIBOX_CLAMAV_PORT: "3310"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped
